{% extends 'base.html' %}
{% block title %}Login - TaskManager{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card p-4" style="width:100%;max-width:420px;">
        <div class="text-center mb-4">
            <div class="fs-1 mb-2">🗂️</div>
            <h2 class="fw-bold text-primary">Team Task Manager</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control form-control-lg" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
        </form>
        <p class="text-center mt-3 text-muted">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
    </div>
</div>
{% endblock %}
