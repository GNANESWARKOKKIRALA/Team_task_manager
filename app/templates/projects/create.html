{% extends 'base.html' %}
{% block title %}Create Project{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-4">📁 Create New Project</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Project Name *</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Website Redesign" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="What is this project about?"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Create Project</button>
                    <a href="{{ url_for('projects.list_projects') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
